<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ancelotti - Chama o Neymar pra Copa</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 600px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #00ffcc;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 15px 25px;
      background: #00ffcc;
      color: #000;
      text-decoration: none;
      border-radius: 50px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00caa3;
      transform: scale(1.05);
    }

    .highlight {
      color: #ffd700;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Ancelotti 🇧🇷⚽</h1>

    <p>
      Ei <span class="highlight">Carlo Ancelotti</span>, olha essa mensagem especial:<br><br>
      A torcida está pedindo: <br>
      <span class="highlight">CHAMA O NEYMAR PRA COPA!</span> 🇧🇷🔥
    </p>

    <a class="btn" href="#">Assinar o pedido da torcida</a>
  </div>
</body>
</html>
