<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icone.png">
<title>Site | Site</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<aside class="sidebar">
    <div class="sidebar-title">
        Biblioteca HTML | CSS
    </div>
    <input
        class="search"
        id="searchInput"
        placeholder="Pesquisar comando..."
    >
    <div id="commandsContainer"></div>
</aside>

<div class="main">
    <div class="topbar">
        <button class="run-btn" onclick="runCode()">
            ▶ Executar
        </button>
    </div>

    <div class="download-panel">
        <h3>Download do seu Projeto</h3>
        <input
            type="text"
            id="projectName"
            placeholder="Nome do projeto"
            value="meu-site"
        >

        <div class="download-buttons">

            <button onclick="downloadHTML()">
                Baixar | HTML
            </button>

            <button onclick="downloadCSS()">
                Baixar | CSS
            </button>

            <button onclick="downloadCompleteProject()">
                Baixar | Projeto Completo
            </button>
        </div>
    </div>

    <div class="editor-area">
        <div class="editor">
            <div class="editor-title">
                HTML
            </div>
            <textarea id="htmlCode"><h1>Olá Mundo</h1>

<p>Observe seu Site sendo produzido</p>

<button>Meu Botão</button></textarea>

        </div>

        <div class="editor">

            <div class="editor-title">
                CSS
            </div>

            <textarea id="cssCode">body{
    font-family:Arial;
    text-align:center;
    padding:40px;
    background:#f1f5f9;
}

h1{
    color:#2563eb;
}

button{
    padding:12px 20px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:10px;
}</textarea>

        </div>

    </div>
    <div class="preview">

        <div class="preview-title">
            Preview Do Site | Veja seu Site sendo criado em tempo real
        </div>

        <iframe id="preview"></iframe>

    </div>
</div>

<script src="script.js"></script>

</body>
</html>
